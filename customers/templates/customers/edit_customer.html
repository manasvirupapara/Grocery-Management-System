{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Customer{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/delivery.css' %}">
<style>
.form-page {
    max-width: 600px;
    margin: 0 auto;
}
.form-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid #e5e7eb;
    padding: 24px;
}
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #374151;
    font-weight: 500;
    font-size: 14px;
}
.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
}
.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}
.form-actions button,
.form-actions a {
    flex: 1;
    padding: 10px 20px;
    border-radius: 8px;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    border: none;
    cursor: pointer;
}
.form-actions button {
    background: #2e7d32;
    color: white;
}
.form-actions button:hover {
    background: #1b5e20;
}
.form-actions a {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #e5e7eb;
}
.form-actions a:hover {
    background: #e5e7eb;
}
</style>
{% endblock %}

{% block content %}

<div class="delivery-page form-page">
    <div class="page-header">
        <h2><i data-lucide="user-cog"></i> Edit Customer</h2>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ customer.name }}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ customer.email }}" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ customer.phone }}" required>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" value="{{ customer.location }}" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="Male" {% if customer.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if customer.gender == 'Female' %}selected{% endif %}>Female</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit">Update Customer</button>
                <a href="{% url 'customer_list' %}">Cancel</a>
            </div>

        </form>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>

{% endblock %}
