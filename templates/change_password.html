{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-container">
        <h1 class="title">
            <span class="text">Change Password</span>
        </h1>

        <p class="subtitle">Update your account password</p>

        {% if messages %}
            {% for message in messages %}
                <div style="padding: 12px; margin-bottom: 15px; border-radius: 8px; font-size: 14px; {% if message.tags == 'success' %}background: #d1fae5; color: #065f46;{% else %}background: #ffebee; color: #c62828;{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #374151; font-size: 14px; font-weight: 500;">Current Password</label>
                <input type="password" name="current_password" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #374151; font-size: 14px; font-weight: 500;">New Password</label>
                <input type="password" name="new_password" required minlength="8" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box;">
                <small style="display: block; margin-top: 4px; color: #6b7280; font-size: 12px;">Minimum 8 characters</small>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; color: #374151; font-size: 14px; font-weight: 500;">Confirm New Password</label>
                <input type="password" name="confirm_password" required minlength="8" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 500;">
                Change Password
            </button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{% url 'dashboard' %}" style="color: #2e7d32; text-decoration: none; font-size: 14px;">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
