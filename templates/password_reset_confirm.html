{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-container">
    <h1>Set New Password</h1>
    <p class="subtitle">Enter your new password below</p>

    <form method="post">
        {% csrf_token %}
        <input type="password" name="new_password1" placeholder="New Password" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px;">
        <input type="password" name="new_password2" placeholder="Confirm New Password" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px;">
        <button type="submit" style="width: 100%; padding: 12px; background: #66bb6a; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">Reset Password</button>
    </form>
</div>
</body>
</html>
